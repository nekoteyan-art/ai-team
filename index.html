<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Team 管理画面 (クリアボタン付き)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --btn-bg: #21262d;
            --btn-border: #363b42;
            --danger-color: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 16px; color: #f0f6fc; display: flex; align-items: center; gap: 8px; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #f0f6fc; display: flex; justify-content: space-between; align-items: center; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        label { font-size: 0.9rem; color: var(--text-muted); }
        .clear-text-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px 6px;
        }
        .clear-text-btn:hover { text-decoration: underline; }
        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        textarea { resize: vertical; min-height: 90px; }
        .btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background-color: #30363d; }
        .btn-primary {
            background-color: var(--accent-color);
            border-color: rgba(240,246,252,0.1);
            color: #ffffff;
            width: 100%;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-danger { color: var(--danger-color); }
        .output-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
        .history-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .badge {
            background: #21262d;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .history-body {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        .history-actions { display: flex; gap: 6px; justify-content: flex-end; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Team 管理画面 <span style="font-size: 0.8rem; color: var(--text-muted);">v2.1</span></h1>

        <!-- 1. 相談の入力 -->
        <div class="card">
            <h2>
                <span>1. 相談の入力</span>
                <button class="clear-text-btn" onclick="clearInputs('consultTitle', 'consultContent')">🗑️ すべてクリア</button>
            </h2>
            <label for="consultTitle">タイトル</label>
            <input type="text" id="consultTitle" placeholder="例：資産形成の初期ステップについて">
            
            <label for="consultCategory">分野</label>
            <select id="consultCategory">
                <option value="資産形成・経済">資産形成・経済</option>
                <option value="電気・制御">電気・制御</option>
                <option value="IT・プログラミング">IT・プログラミング</option>
                <option value="ビジネス・戦略">ビジネス・戦略</option>
                <option value="その他">その他</option>
            </select>

            <div class="label-row">
                <label for="consultContent">相談内容（基本情報や前提条件）</label>
                <button class="clear-text-btn" onclick="clearElement('consultContent')">✕ 消去</button>
            </div>
            <textarea id="consultContent" placeholder="例：年齢、年収、現在の状況や目的など、AIに伝える前提条件を簡潔に入力..."></textarea>
        </div>

        <!-- 2. AIプロンプト生成 -->
        <div class="card">
            <h2>2. AIプロンプト生成</h2>
            <label for="aiRole">役割を選択</label>
            <select id="aiRole">
                <option value="1. 総合戦略家 (ChatGPT)">1. 総合戦略家（整理・課題分析・初期提案）</option>
                <option value="2. 分野別専門家 (ChatGPT/Claude)">2. 分野別専門家（専門的深掘り・実務アドバイス）</option>
                <option value="3. 批判的検証者 (Claude)">3. 批判的検証者（矛盾・リスク・見落とし指摘）</option>
                <option value="4. 最終審査員 (ChatGPT)">4. 最終審査員（意見比較・最終結論の提示）</option>
            </select>
            
            <div class="label-row" style="margin-top: 8px;">
                <label for="prevContext">前回の要点・回答を引き継ぐ場合（任意）</label>
                <button class="clear-text-btn" onclick="clearElement('prevContext')">✕ 消去</button>
            </div>
            <textarea id="prevContext" placeholder="前のAIの回答から、必要な結論や要点だけをここに貼り付けると、次のAIに綺麗に引き継げます..."></textarea>

            <button class="btn btn-primary" onclick="generatePrompt()">プロンプトを生成する</button>

            <label style="margin-top: 12px;">生成されたプロンプト</label>
            <div id="promptOutput" class="output-box">ここにプロンプトが表示されます...</div>
            
            <button class="btn" onclick="copyPrompt()">📋 プロンプトをコピー</button>
        </div>

        <!-- 3. AIの回答記録 -->
        <div class="card">
            <h2>
                <span>3. AIの回答を記録</span>
                <button class="clear-text-btn" onclick="clearElement('aiResponse')">✕ 消去</button>
            </h2>
            <label for="aiResponse">AIからの回答（要点・結論のみをペースト推奨）</label>
            <textarea id="aiResponse" placeholder="AIの返答から、質問文や不要な選択肢を除いた『回答部分』のみを貼り付け..."></textarea>
            
            <button class="btn btn-primary" onclick="saveRecord()">💾 履歴に保存する</button>
        </div>

        <!-- 4. 議論の履歴 -->
        <div class="card">
            <h2>
                <span>4. 議論の履歴</span>
                <span id="historyCount" class="badge">0件</span>
            </h2>
            <div id="historyList">保存された履歴はありません。</div>
            <div style="margin-top: 14px; display: flex; gap: 8px;">
                <button class="btn" onclick="exportText()">📥 まとめてテキスト出力</button>
                <button class="btn btn-danger" onclick="clearHistory()">🗑️ 履歴をクリア</button>
            </div>
        </div>
    </div>

    <script>
        function clearElement(id) {
            document.getElementById(id).value = '';
        }

        function clearInputs(titleId, contentId) {
            if (confirm('タイトルと相談内容をクリアしますか？')) {
                document.getElementById(titleId).value = '';
                document.getElementById(contentId).value = '';
            }
        }

        function generatePrompt() {
            const title = document.getElementById('consultTitle').value.trim();
            const category = document.getElementById('consultCategory').value;
            const content = document.getElementById('consultContent').value.trim();
            const role = document.getElementById('aiRole').value;
            const prevContext = document.getElementById('prevContext').value.trim();

            if (!content) {
                alert('相談内容を入力してください。');
                return;
            }

            let roleInstruction = '';
            if (role.startsWith('1')) {
                roleInstruction = 'あなたは「総合戦略家」です。以下の相談内容を整理し、課題の分析と初期の戦略的提案を行ってください。';
            } else if (role.startsWith('2')) {
                roleInstruction = `あなたは「分野別専門家（${category}分野）」です。以下の相談内容に対して、専門的な視点から詳細な分析と技術的・実務的なアドバイスを行ってください。`;
            } else if (role.startsWith('3')) {
                roleInstruction = 'あなたは「批判的検証者」です。以下の相談内容およびこれまでの提案に対する矛盾点、根拠不足、リスク、見落としを厳しく指摘してください。';
            } else if (role.startsWith('4')) {
                roleInstruction = 'あなたは「最終審査員」です。これまでの議論や意見を比較・検証し、実行可能で質の高い最終結論を提示してください。';
            }

            let prompt = `【AI Team 連携指示書】\n■ 分野: ${category}\n■ テーマ: ${title || '無題'}\n\n■ 今回の役割:\n${roleInstruction}\n\n■ 基本的な相談・前提条件:\n${content}`;
            
            if (prevContext) {
                prompt += `\n\n■ 前段階までの要点・引き継ぎ事項:\n${prevContext}`;
            }
            
            document.getElementById('promptOutput').innerText = prompt;
        }

        function copyPrompt() {
            const text = document.getElementById('promptOutput').innerText;
            if (!text || text.startsWith('ここにプロンプト')) {
                alert('コピーするプロンプトがありません。');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert('プロンプトをコピーしました！');
            });
        }

        function saveRecord() {
            const title = document.getElementById('consultTitle').value.trim() || '無題の相談';
            const category = document.getElementById('consultCategory').value;
            const role = document.getElementById('aiRole').value;
            const response = document.getElementById('aiResponse').value.trim();

            if (!response) {
                alert('保存するAIの回答を入力してください。');
                return;
            }

            const record = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                title,
                category,
                role,
                response
            };

            let history = JSON.parse(localStorage.getItem('aiTeamHistoryV2') || '[]');
            history.unshift(record);
            localStorage.setItem('aiTeamHistoryV2', JSON.stringify(history));

            document.getElementById('aiResponse').value = '';
            document.getElementById('prevContext').value = response; // 次の引き継ぎ用に自動セット
            loadHistory();
            alert('履歴に保存しました！次のAIへの引き継ぎ欄に回答をセットしました。');
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('aiTeamHistoryV2') || '[]');
            document.getElementById('historyCount').innerText = history.length + '件';

            if (history.length === 0) {
                historyList.innerHTML = '保存された履歴はありません。';
                return;
            }

            let html = '';
            history.forEach((item) => {
                html += `<div class="history-item">
                    <div class="history-header">
                        <span>${item.date} | <b>[${item.category}]</b></span>
                        <span class="badge">${item.role}</span>
                    </div>
                    <div style="font-weight: 600; font-size: 0.95rem; color: #f0f6fc; margin-bottom: 4px;">${item.title}</div>
                    <div class="history-body">${item.response}</div>
                    <div class="history-actions">
                        <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="copyHistoryText(${item.id})">📋 この回答をコピー</button>
                        <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="deleteRecord(${item.id})">🗑️ 削除</button>
                    </div>
                </div>`;
            });
            historyList.innerHTML = html;
        }

        function copyHistoryText(id) {
            let history = JSON.parse(localStorage.getItem('aiTeamHistoryV2') || '[]');
            const item = history.find(h => h.id === id);
            if (item) {
                navigator.clipboard.writeText(item.response).then(() => {
                    alert('履歴の回答をコピーしました！');
                });
            }
        }

        function deleteRecord(id) {
            if (confirm('この履歴を削除してもよろしいですか？')) {
                let history = JSON.parse(localStorage.getItem('aiTeamHistoryV2') || '[]');
                history = history.filter(h => h.id !== id);
                localStorage.setItem('aiTeamHistoryV2', JSON.stringify(history));
                loadHistory();
            }
        }

        function clearHistory() {
            if (confirm('すべての履歴を削除してもよろしいですか？')) {
                localStorage.removeItem('aiTeamHistoryV2');
                loadHistory();
            }
        }

        function exportText() {
            let history = JSON.parse(localStorage.getItem('aiTeamHistoryV2') || '[]');
            if (history.length === 0) {
                alert('出力する履歴がありません。');
                return;
            }

            let textData = "=== AI Team 議論・回答履歴 ===\n\n";
            history.forEach((item, index) => {
                textData += `[${index + 1}] 日時: ${item.date}\n分野: ${item.category} / 担当: ${item.role}\nタイトル: ${item.title}\n回答:\n${item.response}\n\n----------------------------------------\n\n`;
            });

            const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ai-team-history.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
